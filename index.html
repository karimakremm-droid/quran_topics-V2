<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مواضيع القرآن الكريم</title>
<!-- These two are the app's largest assets and their filenames are fixed and
     known even before app.enc is decrypted (only their CONTENT needed the
     encrypted-page wrapper, not their existence/path). Preloading them here
     lets the browser start fetching both IN PARALLEL with the app.enc
     fetch+integrity-check+decrypt sequence below, instead of only
     discovering them afterward once the decrypted HTML is written — this
     removes a full serialized round-trip from first paint, which matters
     most on slow connections. Safe: if the filenames ever change in a future
     rebuild, these hints simply go unused (browsers ignore unmatched
     preloads) — the actual page still works exactly the same either way. -->
<link rel="preload" as="style" href="./assets/index-Mq0mt_p_.css" fetchpriority="high" />
<link rel="preload" as="fetch" href="./assets/index-JBEEVQCW.js" crossorigin="anonymous" fetchpriority="high" />
<style>
  html,body{height:100%;margin:0;background:#fdf6e3;}
  #_bl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;font-family:Tajawal,sans-serif;color:#1a6b3a;}
  #_bl .s{width:36px;height:36px;border:3px solid #e6dcc0;border-top-color:#1a6b3a;
    border-radius:50%;animation:_sp 0.8s linear infinite;}
  @keyframes _sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="_bl"><div class="s"></div><div>جارٍ التحميل...</div></div>
<script>
(function(){
  var _p1=[173,126,205,41,178,56,208,185];
  var _p2=[193,147,194,206,51,191,124,56];
  var _p3=[102,140,57,78,157,62,80,121];
  var _p4=[141,19,182,96,219,111,56,12];
  var _expectedHash = "ab5c00e96ef24a2ee981d5def0f27efed8ddfbe075b62ced2148ae9eac45eb1d";
  function _bk(){
    var k=new Uint8Array(32);
    [_p1,_p2,_p3,_p4].forEach(function(seg,si){
      for(var i=0;i<8;i++)k[si*8+i]=seg[i];
    });
    return k;
  }
  function _toHex(buf){
    var b = new Uint8Array(buf);
    var s = "";
    for (var i=0;i<b.length;i++) s += b[i].toString(16).padStart(2,"0");
    return s;
  }
  function _fail(msg){
    document.getElementById('_bl').innerHTML =
      '<div style="text-align:center;padding:20px;">' + msg + '</div>';
  }
  async function _boot(){
    try{
      var res = await fetch('./app.enc');
      var buf = await res.arrayBuffer();
      if (crypto.subtle.digest) {
        var hashBuf = await crypto.subtle.digest('SHA-256', buf);
        var actualHash = _toHex(hashBuf);
        if (actualHash !== _expectedHash) {
          _fail('تعذّر التحقق من سلامة الملفات.<br>احذف بيانات المتصفح لهذا الموقع وأعد المحاولة، أو تحقق من الاتصال.');
          return;
        }
      }
      var bytes = new Uint8Array(buf);
      var iv = bytes.slice(0,16);
      var ct = bytes.slice(16);
      var cryptoKey = await crypto.subtle.importKey('raw', _bk(), {name:'AES-CBC'}, false, ['decrypt']);
      var plainBuf = await crypto.subtle.decrypt({name:'AES-CBC', iv: iv}, cryptoKey, ct);
      var html = new TextDecoder('utf-8').decode(plainBuf);
      document.open();
      document.write(html);
      document.close();
    } catch(e) {
      _fail('تعذّر تحميل التطبيق.<br>تحقق من الاتصال بالإنترنت وأعد المحاولة.');
    }
  }
  _boot();
})();
</script>
</body>
</html>
